[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/coldstorage_id_rsa
ansible_python_interpreter=/usr/bin/python3
app_name=coldstorage-app
app_port=8080
app_root_dir=/opt/coldstorage-app
app_user=coldstorage
app_group=coldstorage

[staging]
node1.coldstorage.internal ansible_host=192.168.56.101 env=staging

[production]
node2.coldstorage.internal ansible_host=192.168.56.102 env=production

[coldstorage_servers:children]
staging
production
