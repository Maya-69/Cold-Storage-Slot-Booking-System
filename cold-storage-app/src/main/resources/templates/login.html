<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | Cold Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/" id="brand-logo">
            <i class="bi bi-snow2 text-info"></i> Cold Storage Slot Booking System
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-dark text-white py-3 text-center">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-right"></i> User Login</h4>
                    <p class="mb-0 small opacity-75">Access Cold Storage Management</p>
                </div>
                <div class="card-body p-4">

                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" id="login-success-alert">
                        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" id="login-error-alert">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/login}" method="post" id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g., mayuresh" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="e.g., devops123" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="btn-submit-login">
                            Log In
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted small">Need an account? </span>
                        <a href="/register" class="small fw-bold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
