<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book a Chamber Slot | Cold Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/" id="brand-logo">
            <i class="bi bi-snow2 text-info"></i> Cold Storage Slot Booking System
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/" id="nav-dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/slots" id="nav-slots">Chamber Directory</a></li>
                <li class="nav-item"><a class="nav-link active" href="/bookings/new" id="nav-book">Book a Slot</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings" id="nav-bookings">All Bookings</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-check"></i> Reserve a Cold Storage Chamber Slot</h4>
                    <p class="mb-0 small opacity-75">Provide consignment details and required duration for automated slot allocation.</p>
                </div>
                <div class="card-body p-4">

                    <!-- Error Alert -->
                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" id="error-alert">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/bookings/new}" th:object="${booking}" method="post" id="booking-form">
                        
                        <div class="row g-3">
                            <!-- Farmer Name -->
                            <div class="col-md-6">
                                <label for="farmerName" class="form-label fw-bold">Farmer / Trader Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="farmerName" th:field="*{farmerName}" 
                                       placeholder="e.g., Ramesh Patil" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('farmerName')}" th:errors="*{farmerName}"></div>
                            </div>

                            <!-- Contact Number -->
                            <div class="col-md-6">
                                <label for="contactNumber" class="form-label fw-bold">Contact Phone Number <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="contactNumber" th:field="*{contactNumber}" 
                                       placeholder="e.g., 9822012345" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></div>
                            </div>

                            <!-- Chamber Code -->
                            <div class="col-md-6">
                                <label for="chamberCode" class="form-label fw-bold">Select Target Chamber <span class="text-danger">*</span></label>
                                <select class="form-select" id="chamberCode" th:field="*{chamberCode}" required>
                                    <option value="" disabled selected>-- Choose Chamber --</option>
                                    <option th:each="c : ${chambers}" 
                                            th:value="${c.chamberCode}" 
                                            th:text="${c.chamberCode} + ' - ' + ${c.name} + ' (' + ${c.zoneType} + ' | Rs. ' + ${c.pricePerDayPerCrate} + '/crate/day)'">
                                        CH-DF1 - Deep Freeze
                                    </option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('chamberCode')}" th:errors="*{chamberCode}"></div>
                            </div>

                            <!-- Commodity Type -->
                            <div class="col-md-6">
                                <label for="commodityType" class="form-label fw-bold">Perishable Commodity Type <span class="text-danger">*</span></label>
                                <select class="form-select" id="commodityType" th:field="*{commodityType}" required>
                                    <option value="" disabled selected>-- Select Commodity --</option>
                                    <option value="Apples">Apples / Pears</option>
                                    <option value="Potatoes">Potatoes / Onions</option>
                                    <option value="Dairy">Fresh Milk / Butter / Cheese</option>
                                    <option value="Seafood">Seafood / Prawns / Fish</option>
                                    <option value="Poultry">Poultry / Fresh Meat</option>
                                    <option value="Vegetables">Green Leafy Vegetables / Capsicum</option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('commodityType')}" th:errors="*{commodityType}"></div>
                            </div>

                            <!-- Crates Count -->
                            <div class="col-md-4">
                                <label for="cratesCount" class="form-label fw-bold">Quantity (Crates) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="cratesCount" th:field="*{cratesCount}" 
                                       min="1" max="500" placeholder="e.g., 50" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('cratesCount')}" th:errors="*{cratesCount}"></div>
                            </div>

                            <!-- Check-in Date -->
                            <div class="col-md-4">
                                <label for="checkInDate" class="form-label fw-bold">Check-in Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="checkInDate" th:field="*{checkInDate}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('checkInDate')}" th:errors="*{checkInDate}"></div>
                            </div>

                            <!-- Check-out Date -->
                            <div class="col-md-4">
                                <label for="checkOutDate" class="form-label fw-bold">Check-out Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="checkOutDate" th:field="*{checkOutDate}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('checkOutDate')}" th:errors="*{checkOutDate}"></div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/slots" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold" id="submit-booking-btn">
                                <i class="bi bi-shield-check"></i> Submit Reservation Request
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
