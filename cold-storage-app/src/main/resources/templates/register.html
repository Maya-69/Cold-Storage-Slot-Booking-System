<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register | Cold Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/" id="brand-logo">
            <i class="bi bi-snow2 text-info"></i> Cold Storage Slot Booking System
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-primary text-white py-3 text-center">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus"></i> Farmer / Trader Registration</h4>
                    <p class="mb-0 small opacity-75">Create an account to reserve and track cold storage slots</p>
                </div>
                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" id="register-error-alert">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post" id="register-form">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Username <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="e.g., farmer_ramesh" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-bold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="e.g., Ramesh Patil" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="ramesh@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-bold">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="9822012345" required>
                        </div>

                        <div class="mb-4">
                            <label for="role" class="form-label fw-bold">Account Role</label>
                            <select class="form-select" id="role" th:field="*{role}">
                                <option value="FARMER">Farmer / Agricultural Producer</option>
                                <option value="TRADER">Commodity Trader / Wholesaler</option>
                                <option value="MANAGER">Warehouse Operations Manager</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="btn-submit-register">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted small">Already registered? </span>
                        <a href="/login" class="small fw-bold">Log in here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
